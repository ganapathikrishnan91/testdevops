trigger:
  - main
 
pool:
  name: GANA_AZUREDEVOPS
 
variables:
  imageName: 'myapp'                       # <-- CHANGE: your image/repo name
  imageTag: '$(Build.BuildId)'             # unique tag per pipeline run
  qualysPod: 'US1'                         # <-- CHANGE: your Qualys POD
 
steps:
# ─────────────────────────────────────────
# STEP 1: System info (sanity check on agent)
# ─────────────────────────────────────────
  - script: |
      uname -a
      hostname
      docker --version
    displayName: 'System info'
 
# ─────────────────────────────────────────
# STEP 2: Build the Docker image locally
# ─────────────────────────────────────────
  - task: Docker@2
    displayName: 'Build image locally'
    inputs:
      command: 'build'
      Dockerfile: '**/Dockerfile'          # <-- CHANGE if Dockerfile is elsewhere
      repository: '$(imageName)'
      tags: |
        $(imageTag)
      arguments: '--load'                  # ensures image lands in local docker engine
 
# ─────────────────────────────────────────
# STEP 3: Verify the built image is present locally
# ─────────────────────────────────────────
  - script: |
      docker images | grep $(imageName)
    displayName: 'Verify built image'
 
# ─────────────────────────────────────────
# STEP 4: Download QScanner
# ─────────────────────────────────────────
#  - task: Bash@3
#    displayName: 'Download QScanner'
#   inputs:
#      targetType: 'inline'
#      script: |
#        wget https://www.qualys.com/qscanner/download/latest/download_qscanner.sh
#        chmod +x download_qscanner.sh
#        ./download_qscanner.sh/tmp/linux-amd64/qscanner
#        ls -la /tmp/linux-amd64

 
# ─────────────────────────────────────────
# STEP 5: Run QScanner against the locally built image
# ─────────────────────────────────────────
  - task: Bash@3
    displayName: 'Run QScanner'
    env:
      QUALYS_ACCESS_TOKEN: $(qualysAccessToken)   # set as secret pipeline variable
    inputs:
      targetType: 'inline'
      script: |
        cd /home/azureuser/qualys/qscanner/data/linux-amd64
        ./qscanner image $(imageName):$(imageTag) \
          --mode get-report \
          --log-level debug \
          --pod $(qualysPod) \
          --access-token "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzUxMiJ9..VrsuNAQbVpACiHgKAvsWCH5tn6WJr6lY1ze2LKfVobOaQp6mhpM7AiteClUTbkZBBwGRuEE1RVTeUJaXbWMJ1w" \

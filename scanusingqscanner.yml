trigger:
- main

pool:
  name: GANA_AZUREDEVOPS

steps:
# ─────────────────────────────────────────
# STEP 1: Check the systeminfo 
# ─────────────────────────────────────────
  - script: |
      uname -a
      hostname
    displayName: 'systeminfo'
# ─────────────────────────────────────────
# STEP 2: Download QSCANNER
# ─────────────────────────────────────────
  - task: Bash@3
    displayName: "Download qscanner"
    inputs:
      targetType: 'inline'
      script: |
        wget https://www.qualys.com/qscanner/download/latest/download_qscanner.sh
        chmod +x download_qscanner.sh
        ./download_qscanner.sh
        ls -la
        chmod +x /tmp/linux-amd64/qscanner
        chmod +x /home/azureuser/qualys/qscanner/data/linux-amd64
# ─────────────────────────────────────────
# STEP 3: Run QScanner to scan on nginx:mainline-alpine3.23
# ─────────────────────────────────────────
  - task: Bash@3
    displayName: "Run QScanner"
    inputs:
      targetType: 'inline'
      script: |
        cd /home/azureuser/qualys/qscanner/data/linux-amd64
        ./qscanner image nginx:mainline-alpine3.23 \
          --mode get-report \
          --log-level debug \
          --pod US1 \
          --access-token "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzUxMiJ9..VrsuNAQbVpACiHgKAvsWCH5tn6WJr6lY1ze2LKfVobOaQp6mhpM7AiteClUTbkZBBwGRuEE1RVTeUJaXbWMJ1w" \
